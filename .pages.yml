# Pages CMS configuration (https://pagescms.org). Sign in at app.pagescms.org with GitHub
# and open this repository to edit text and images in a web editor. Each save is a commit,
# and Cloudflare redeploys the site automatically.
media:
  - name: images
    label: Images
    input: public/images
    output: /images
  - name: files
    label: Files (CV and other downloads)
    input: public/files
    output: /files
    extensions: [pdf]

content:
  - name: settings
    label: Site settings (email, links, headshot, booking)
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - { name: name, label: Site name (business name shown top left), type: string }
      - { name: personName, label: Your name (shown under the business name and used for search engines), type: string }
      - { name: personTitle, label: Your title (e.g. Principal or Founder), type: string }
      - { name: url, label: Site address, type: string }
      - { name: searchIndexing, label: Allow search engines to index this site (turn off to hide it from Google), type: boolean }
      - { name: tagline, label: Tagline (used in search results), type: string }
      - { name: email, label: Contact email, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: cvFile, label: CV (PDF; leave empty to hide all CV links), type: file, options: { media: files } }
      - { name: cvLabel, label: CV link text in the footer, type: string }
      - { name: location, label: Location (footer), type: string }
      - { name: calendlyUrl, label: Calendly link (blank sends buttons to Contact), type: string }
      - { name: headshot, label: Headshot photo (square works best), type: image, options: { media: images } }
      - { name: headshotAlt, label: Headshot description for screen readers, type: string }
      - { name: logosLabel, label: Label above the logo row, type: string }
      - name: logos
        label: Company logos (shown on Home and About, in this order)
        type: object
        list: true
        fields:
          - { name: name, label: Company name, type: string }
          - { name: src, label: Logo (transparent PNG, single color), type: image, options: { media: images } }
          - { name: height, label: Display height in pixels (about 18 to 32), type: number }
      - { name: ctaHeadline, label: Default closing headline, type: string }
      - { name: ctaBody, label: Default closing text, type: text }
  - name: home
    label: Home page
    type: file
    path: src/content/pages/home.md
    fields:
      - { name: seoTitle, label: Browser tab and Google title, type: string }
      - { name: description, label: Google description, type: text }
      - { name: headshotShow, label: Show headshot at the top of the page, type: boolean }
      - name: headshotSize
        label: Headshot size
        type: select
        options:
          values:
            - { value: small, label: "Small (160 px wide)" }
            - { value: medium, label: "Medium (240 px wide)" }
            - { value: large, label: "Large (320 px wide)" }
      - { name: headshotWidth, label: Headshot exact width in pixels (optional; overrides size; 0 = use size), type: number }
      - { name: eyebrow, label: Small line above the headline, type: string }
      - { name: title, label: Headline, type: string }
      - { name: subhead, label: Subhead, type: text }
      - name: proof
        label: Results bar
        type: object
        list: true
        fields:
          - { name: figure, label: Big number, type: string }
          - { name: lead, label: Bold lead-in, type: string }
          - { name: detail, label: Detail, type: string }
      - { name: previouslyAt, label: Previously at, type: string }
      - name: ways
        label: Three ways to work together
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: title, label: Title, type: string }
          - { name: body, label: Text, type: text }
          - { name: linkLabel, label: Link text, type: string }
          - { name: linkHref, label: Link address, type: string }
      - { name: featured, label: Featured case studies (file names), type: string, list: true }
      - name: how
        label: How I work
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: body, label: Text, type: text }
      - name: testimonial
        label: Testimonial
        type: object
        fields:
          - { name: text, label: Quote, type: text }
          - { name: attribution, label: Attribution, type: string }
      - { name: aboutHeadline, label: About teaser headline, type: string }
      - { name: aboutBody, label: About teaser text, type: text }
      - { name: ctaHeadline, label: Closing headline, type: string }
      - { name: ctaBody, label: Closing text, type: text }

  - name: about
    label: About page
    type: file
    path: src/content/pages/about.md
    fields:
      - { name: title, label: Headline, type: string }
      - { name: seoTitle, label: Browser tab and Google title, type: string }
      - { name: description, label: Google description, type: text }
      - { name: body, label: Page text, type: rich-text }

  - name: services
    label: Service pages
    type: collection
    path: src/content/services
    view: { fields: [serviceType, title] }
    fields:
      - { name: serviceType, label: Service name, type: string }
      - { name: title, label: Headline, type: string }
      - { name: subhead, label: Subhead, type: text }
      - { name: seoTitle, label: Browser tab and Google title, type: string }
      - { name: description, label: Google description, type: text }
      - { name: order, label: Sort order, type: number }
      - { name: price, label: Starting price in dollars (blank if not shown), type: number }
      - name: faqs
        label: Questions
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
      - { name: body, label: Page text, type: rich-text }

  - name: work
    label: Case studies
    type: collection
    path: src/content/work
    view: { fields: [cardTitle] }
    fields:
      - { name: title, label: Headline, type: string }
      - { name: seoTitle, label: Browser tab and Google title, type: string }
      - { name: description, label: Google description, type: text }
      - { name: order, label: Sort order, type: number }
      - { name: cardTitle, label: Card title, type: string }
      - { name: logo, label: Company logo (optional), type: image, options: { media: images } }
      - { name: logoAlt, label: Company name for the logo, type: string }
      - { name: summary, label: Card summary, type: text }
      - { name: metric, label: Big number, type: string }
      - { name: metricLabel, label: Big number caption, type: string }
      - { name: industry, label: Industry tags, type: string, list: true }
      - { name: capability, label: Capability tags, type: string, list: true }
      - name: glance
        label: At a glance
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: value, label: Value, type: string }
      - name: quote
        label: Quote
        type: object
        fields:
          - { name: text, label: Quote, type: text }
          - { name: attribution, label: Attribution, type: string }
      - { name: ctaHeadline, label: Closing headline, type: string }
      - name: ctaSecondary
        label: Second closing link
        type: object
        fields:
          - { name: label, label: Link text, type: string }
          - { name: href, label: Link address, type: string }
      - { name: body, label: Page text, type: rich-text }

  - name: services-overview
    label: Services overview page
    type: file
    path: src/content/pages/services.md
    fields:
      - { name: title, label: Headline, type: string }
      - { name: seoTitle, label: Browser tab and Google title, type: string }
      - { name: description, label: Google description, type: text }
      - { name: intro, label: Intro, type: text }
      - name: offers
        label: Offers
        type: object
        list: true
        fields:
          - { name: label, label: Label (Lead, Diagnose, Build), type: string }
          - { name: title, label: Title, type: string }
          - { name: whoFor, label: Who it's for, type: text }
          - { name: whatYouGet, label: What you get, type: text }
          - { name: body, label: Short description (for coming-soon offers), type: text }
          - { name: linkLabel, label: Link text, type: string }
          - { name: linkHref, label: Link address, type: string }
          - { name: comingSoon, label: Coming soon, type: boolean }
      - name: faqs
        label: Questions
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }

  - name: work-index
    label: Work page (case study list)
    type: file
    path: src/content/pages/work.md
    fields:
      - { name: title, label: Headline, type: string }
      - { name: seoTitle, label: Browser tab and Google title, type: string }
      - { name: description, label: Google description, type: text }
      - { name: intro, label: Intro, type: text }
      - { name: ctaHeadline, label: Closing headline, type: string }

  - name: contact
    label: Contact page
    type: file
    path: src/content/pages/contact.md
    fields:
      - { name: title, label: Headline, type: string }
      - { name: seoTitle, label: Browser tab and Google title, type: string }
      - { name: description, label: Google description, type: text }
      - { name: intro, label: Intro, type: text }
      - { name: bookingHeading, label: Booking heading, type: string }
      - { name: bookingFallback, label: Text shown if no Calendly link, type: text }
      - { name: noteHeading, label: Email heading, type: string }
      - { name: noteBody, label: Email text, type: text }
      - { name: locationText, label: Location line, type: string }

  - name: privacy
    label: Privacy page
    type: file
    path: src/content/pages/privacy.md
    fields:
      - { name: title, label: Headline, type: string }
      - { name: seoTitle, label: Browser tab title, type: string }
      - { name: description, label: Google description, type: text }
      - { name: body, label: Page text, type: rich-text }

  - name: not-found
    label: Page-not-found message
    type: file
    path: src/content/pages/not-found.md
    fields:
      - { name: title, label: Headline, type: string }
      - { name: seoTitle, label: Browser tab title, type: string }
      - { name: description, label: Description, type: text }
      - { name: body, label: Text, type: rich-text }
